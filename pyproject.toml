[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vog"
version = "0.2.0"
description = "VOG: variational optimal control for diffusion guidance and model adaptation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=1.26,<3",
  "diffusers>=0.36,<1", "transformers>=4.57.1,<4.58",
  "huggingface-hub>=0.34,<1", "peft>=0.17,<1", "pillow>=10.4",
  "wandb>=0.18,<1",
]

[project.optional-dependencies]
hps = ["omegaconf>=2.3,<3", "trl==0.23.1", "prettytable", "fire", "matplotlib", "tensorboard"]
evaluation = ["clip-anytorch>=2.6,<3", "fairscale==0.4.13", "timm>=1.0"]
dev = ["ruff>=0.8", "build"]

[project.scripts]
dvoc = "dvoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
